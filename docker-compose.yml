version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Automated Update Service (Watchtower)
  # ─────────────────────────────────────────────────────────────────────────
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup
    restart: always

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL Database Engine
  # ─────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: shahbaz_admin
      POSTGRES_PASSWORD: shahbaz_password
      POSTGRES_DB: smartwell_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartwell_net
    deploy:
      resources:
        limits:
          memory: 160M

  # ─────────────────────────────────────────────────────────────────────────
  # MQTT Broker
  # ─────────────────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_project_mosquitto_1
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - smartwell_net
    deploy:
      resources:
        limits:
          memory: 40M

  # ─────────────────────────────────────────────────────────────────────────
  # FastAPI Backend (Production CI/CD Ready)
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    image: shahbazzulfiqar/smartwell:latest
    container_name: fastapi_backend
    restart: always
    ports:
      - "80:8000"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://shahbaz_admin:shahbaz_password@db:5432/smartwell_db
      JWT_SECRET_KEY: your_super_secret_key
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TELEMETRY_TOPIC_PREFIX: tubewell
      MQTT_TELEMETRY_TOPIC_SUFFIX: telemetry
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 6
    networks:
      - smartwell_net
    deploy:
      resources:
        limits:
          memory: 200M

networks:
  smartwell_net:
    driver: bridge

volumes:
  postgres_data: